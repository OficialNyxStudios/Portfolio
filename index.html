<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #f3ecdf;
      --muted: #b7ad9e;
      --bg: #161411;
      --line: #3a342c;
      --accent: #e7a15a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at top, #2a241c 0%, transparent 55%),
        var(--bg);
      color: var(--ink);
      font-family: "Outfit", sans-serif;
    }

    main {
      width: min(920px, calc(100% - 48px));
      padding: 48px 0 64px;
      border-top: 1px solid var(--line);
    }

    .kicker {
      margin-bottom: 28px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    h1 {
      font-family: "Instrument Serif", serif;
      font-size: clamp(4.2rem, 12vw, 8.5rem);
      font-weight: 400;
      line-height: 0.88;
      letter-spacing: -0.03em;
    }

    h1 span {
      display: block;
      font-style: italic;
    }

    .lead {
      max-width: 34rem;
      margin-top: 32px;
      color: var(--muted);
      font-size: 1.15rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Portafolio</p>
    <h1>HELLO <span>WORLD</span></h1>
    <p class="lead">Esta es la primera página del portafolio. A partir de aquí se irá construyendo el sitio.</p>
  </main>
</body>
</html>
